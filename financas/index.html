<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle Gastos PRO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1e34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos PRO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0f1e34;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:360px;display:flex;flex-direction:column;align-items:center;gap:18px}
  img{width:132px;height:132px;border-radius:30px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  h1{font-size:1.5rem}
  p{color:#cbd5e1;line-height:1.5;font-size:.95rem}
  a.abrir{display:block;width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,#f5b301,#d97706);color:#1c1300;font-weight:800;font-size:1.05rem;text-decoration:none}
  ol{text-align:left;color:#cbd5e1;font-size:.9rem;line-height:1.6;padding-left:20px}
  .como{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;width:100%}
  .como b{display:block;margin-bottom:6px;color:#f8fafc}
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="Ícone do Controle Gastos PRO">
  <h1>Controle Gastos PRO</h1>
  <a class="abrir" id="abrir" href="https://claude.ai/artifact/FUHum7Sdy55GKewtbWTQ1P">Abrir o app</a>
  <div class="como" id="como">
    <b>Para ter o ícone na tela inicial</b>
    <ol>
      <li>No Chrome, toque nos três pontinhos.</li>
      <li>Escolha "Adicionar à tela inicial" e depois "Instalar".</li>
      <li>Toque no ícone da moeda: o app abre direto.</li>
    </ol>
  </div>
  <p>Seus lançamentos ficam na sua conta do Claude. Esta página só guarda o atalho.</p>
</main>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
  var instalado = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (instalado || /[?&]abrir=1/.test(location.search)) {
    document.getElementById('como').style.display = 'none';
    location.replace(document.getElementById('abrir').href);
  }
</script>
</body>
</html>
