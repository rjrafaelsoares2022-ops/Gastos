<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FocusMatriz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>FocusMatriz</title>
<style>
:root {
  --bg: #f4f5fb;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --brand: #4f46e5;
  /* Ordem: 1 urgente & importante, 2 urgente, 3 importante, 4 quando der */
  --q1: #dc2626; --q1-soft: #fef2f2; --q1-line: #fecaca;
  --q2: #ea580c; --q2-soft: #fff7ed; --q2-line: #fed7aa;
  --q3: #2563eb; --q3-soft: #eff6ff; --q3-line: #bfdbfe;
  --q4: #0d9488; --q4-soft: #f0fdfa; --q4-line: #99f6e4;
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.35;
  padding-bottom: 96px;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 12px; }

/* ---------- Cabeçalho compacto ---------- */
header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.top { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.logo { width: 38px; height: 38px; flex: none; display: block; }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
.brand p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  display: grid; place-items: center; font-size: 20px; font-weight: 700;
  background: #f1f5f9;
}

.filters { display: flex; gap: 6px; padding-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters.subs { margin-top: -4px; }
.filters:empty { display: none; }
.chip {
  flex: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: #f1f5f9; color: #334155; border: 1px solid transparent;
}
.chip b { font-weight: 700; opacity: .6; margin-left: 4px; }
.chip.on { background: #eef2ff; color: var(--brand); border-color: #c7d2fe; }
.chip.small { padding: 4px 10px; font-size: 12px; }

/* ---------- Resumo do dia ---------- */
.today {
  display: block; width: 100%; text-align: left;
  margin: 12px 0 10px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 10px 12px;
}
.today-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.today-row strong { color: var(--text); }
.bar-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.bar { flex: 1; height: 6px; background: #eef2f7; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22c55e, #16a34a); border-radius: 99px; transition: width .4s; }
.pct { font-size: 12px; font-weight: 800; color: #16a34a; min-width: 34px; text-align: right; }

/* ---------- Captura rápida ---------- */
.quick { margin-bottom: 14px; }
.quick form { display: flex; gap: 6px; }
.quick input {
  flex: 1; min-width: 0; padding: 11px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: #fff; outline: none;
}
.quick input:focus { border-color: #a5b4fc; box-shadow: 0 0 0 3px #e0e7ff; }
.quick-q { display: none; gap: 6px; margin-top: 6px; }
.quick.typing .quick-q { display: grid; grid-template-columns: repeat(4, 1fr); }
.qbtn { padding: 8px 2px; border-radius: 9px; font-size: 12px; font-weight: 700; color: #fff; }
.qbtn.q1 { background: var(--q1); } .qbtn.q2 { background: var(--q2); }
.qbtn.q3 { background: var(--q3); } .qbtn.q4 { background: var(--q4); }

/* ---------- Quadrantes ---------- */
.quad { margin-bottom: 14px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--card); }
.quad-head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 12px; text-align: left; }
.quad-head .qt { font-weight: 800; font-size: 14px; flex: 1; min-width: 0; }
.quad-head .qt small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .5px; opacity: .8; text-transform: uppercase; }
.count { min-width: 26px; padding: 2px 8px; border-radius: 99px; font-size: 13px; font-weight: 800; text-align: center; }
.caret { font-size: 12px; opacity: .7; transition: transform .2s; }
.quad.closed .caret { transform: rotate(-90deg); }
.quad.closed .quad-body { display: none; }
.quad-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }

/* Q1 continua vermelho e chamativo, mas numa faixa fina */
.quad.q1 { border: 2px solid var(--q1); }
.quad.q1 .quad-head { background: linear-gradient(90deg, #b91c1c, #ef4444); color: #fff; }
.quad.q1 .count { background: #fff; color: var(--q1); }
.quad.q1 .quad-body { background: var(--q1-soft); }
.quad.q2 { border-color: var(--q2-line); } .quad.q2 .quad-head { background: var(--q2-soft); color: var(--q2); } .quad.q2 .count { background: var(--q2); color: #fff; }
.quad.q3 { border-color: var(--q3-line); } .quad.q3 .quad-head { background: var(--q3-soft); color: var(--q3); } .quad.q3 .count { background: var(--q3); color: #fff; }
.quad.q4 { border-color: var(--q4-line); } .quad.q4 .quad-head { background: var(--q4-soft); color: var(--q4); } .quad.q4 .count { background: var(--q4); color: #fff; }
.quad.later { border-color: #c7d2fe; } .quad.later .quad-head { background: #eef2ff; color: var(--brand); } .quad.later .count { background: var(--brand); color: #fff; }

.empty { font-size: 13px; color: var(--muted); padding: 8px 6px; }
.day { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 6px 4px 0; }

/* ---------- Tarefa (cartão fino) ---------- */
.task {
  display: flex; align-items: flex-start; gap: 10px;
  background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--qc);
  border-radius: 10px; padding: 8px 10px;
  transition: opacity .25s, transform .25s;
}
.task.q1 { --qc: var(--q1); border-color: var(--q1-line); border-left-color: var(--q1); }
.task.q2 { --qc: var(--q2); } .task.q3 { --qc: var(--q3); } .task.q4 { --qc: var(--q4); }
.task.leaving { opacity: 0; transform: translateX(40px) scale(.97); }

.check {
  width: 24px; height: 24px; flex: none; margin-top: 1px; border-radius: 50%;
  border: 2px solid #94a3b8; display: grid; place-items: center; color: #fff; font-size: 13px;
  transition: background .15s, border-color .15s;
}
.task.leaving .check { background: #10b981; border-color: #10b981; }
.task-main { flex: 1; min-width: 0; text-align: left; }
.task-title { font-weight: 650; font-size: 15px; color: var(--qc); word-break: break-word; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; font-size: 12px; color: var(--muted); }
.meta .late { color: var(--q1); font-weight: 600; }
.meta .hi { color: var(--q1); font-weight: 700; }
.meta .desc { flex-basis: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Botão flutuante ---------- */
.fab {
  position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 25;
  width: 56px; height: 56px; border-radius: 18px; font-size: 28px; color: #fff;
  background: linear-gradient(135deg, #4338ca, #9333ea); box-shadow: 0 8px 20px rgba(79,70,229,.4);
}

/* ---------- Folhas (menu, formulário, histórico) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 40; display: none; }
.sheet-bg.open { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; overflow-y: auto;
  background: #fff; border-radius: 18px 18px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .22s ease; visibility: hidden;
  max-width: 640px; margin: 0 auto;
}
.sheet.open { transform: none; visibility: visible; }
.sheet-close { position: absolute; top: 8px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: #f1f5f9; color: var(--muted); font-size: 15px; }
.grab { width: 40px; height: 4px; background: #cbd5e1; border-radius: 99px; margin: 0 auto 12px; }
.sheet h2 { font-size: 17px; margin-bottom: 12px; }

.menu-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid #f1f5f9; text-align: left; font-weight: 600; }
.menu-item span { font-size: 20px; width: 26px; text-align: center; }
.menu-item.danger { color: var(--q1); }
.menu-item.install { color: var(--brand); }

.field { margin-bottom: 12px; }
.field > label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
.field input, .field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; outline: none;
}
.field input:focus, .field textarea:focus { border-color: #a5b4fc; box-shadow: 0 0 0 3px #e0e7ff; }
.field textarea { min-height: 60px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  padding: 8px 11px; border-radius: 9px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--line); background: #fff;
}
.seg button.on { background: #eef2ff; border-color: #a5b4fc; color: var(--brand); }
.seg button.add { border-style: dashed; color: var(--muted); }
.seg.subs { margin-top: 8px; }
.seg.subs button { padding: 6px 10px; font-size: 12px; }
.seg.quads { display: grid; grid-template-columns: 1fr 1fr; }
.seg.quads button { text-align: left; }
.seg.quads button small { display: block; font-size: 11px; font-weight: 500; opacity: .8; }
.seg.quads button[data-v="1"].on { background: var(--q1-soft); border-color: var(--q1); color: var(--q1); }
.seg.quads button[data-v="2"].on { background: var(--q2-soft); border-color: var(--q2); color: var(--q2); }
.seg.quads button[data-v="3"].on { background: var(--q3-soft); border-color: var(--q3); color: var(--q3); }
.seg.quads button[data-v="4"].on { background: var(--q4-soft); border-color: var(--q4); color: var(--q4); }

.actions { display: flex; gap: 8px; margin-top: 6px; }
.btn { flex: 1; padding: 12px; border-radius: 11px; font-weight: 700; background: #f1f5f9; }
.btn.primary { background: var(--brand); color: #fff; }
.btn.danger { flex: none; padding: 12px 14px; background: #fef2f2; color: var(--q1); }

/* Histórico / lixeira */
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.hist { display: flex; flex-direction: column; gap: 6px; }
.hist-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; }
.hist-item div { flex: 1; min-width: 0; }
.hist-item b { display: block; font-weight: 600; font-size: 14px; word-break: break-word; }
.hist-item small { color: var(--muted); font-size: 12px; }
.hist-item button { flex: none; padding: 7px 10px; border-radius: 9px; background: #eef2ff; color: var(--brand); font-weight: 700; font-size: 13px; }
.hist-foot { margin-top: 12px; }

.sub-manage .hist-item button { background: #fef2f2; color: var(--q1); }
.sub-add { display: flex; gap: 6px; margin-top: 10px; }
.sub-add input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.sub-add select { padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }

/* ---------- Aviso (desfazer) ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 50;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .2s;
  background: #0f172a; color: #fff; border-radius: 12px; padding: 10px 12px 10px 14px;
  display: flex; align-items: center; gap: 12px; font-size: 14px; width: max-content; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: #a5b4fc; font-weight: 800; padding: 4px 6px; }

@media (prefers-reduced-motion: reduce) {
  .task, .sheet, .bar i { transition: none; }
}

/* ---------- PDF / impressão ---------- */
@media print {
  header .icon-btn, .filters, .quick, .fab, .toast, .sheet, .sheet-bg, .caret, .check { display: none !important; }
  header { position: static; border: 0; }
  body { background: #fff; padding: 0; }
  .quad.closed .quad-body { display: flex !important; }
  .quad, .task { break-inside: avoid; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <svg class="logo" id="logo" viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1e1b4b"/><stop offset=".55" stop-color="#4338ca"/><stop offset="1" stop-color="#9333ea"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#lg-bg)"/>
        <ellipse cx="256" cy="256" rx="206" ry="66" transform="rotate(-28 256 256)" fill="none" stroke="#e0e7ff" stroke-opacity=".3" stroke-width="10"/>
        <g transform="translate(256 256) scale(1.12) translate(-256 -256)">
          <g transform="rotate(45 256 256)">
            <rect x="157" y="157" width="92" height="92" rx="24" fill="#ef4444"/>
            <rect x="263" y="157" width="92" height="92" rx="24" fill="#f97316"/>
            <rect x="157" y="263" width="92" height="92" rx="24" fill="#3b82f6"/>
            <rect x="263" y="263" width="92" height="92" rx="24" fill="#14b8a6"/>
          </g>
          <path d="M229 182 l19 19 l37 -40" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <path id="orbit" d="M 74.1 352.7 A 206 66 -28 1 0 437.9 159.3 A 206 66 -28 1 0 74.1 352.7" fill="none"/>
        <circle r="20" fill="#fff">
          <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
        </circle>
      </svg>
      <div class="brand">
        <h1>FocusMatriz</h1>
        <p id="todayLabel">Matriz Eisenhower</p>
      </div>
      <button class="icon-btn" id="menuBtn" aria-label="Mais opções">⋯</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="filters subs" id="subFilters"></div>
  </div>
</header>

<main class="wrap">
  <button class="today" id="todayCard" aria-label="Ver concluídas">
    <div class="today-row">
      <span>✅ <strong id="doneToday">0</strong> feitas hoje</span>
      <span>⏳ <strong id="pendingCount">0</strong> para hoje</span>
      <span>🔥 <strong id="q1Count">0</strong> no Q1</span>
    </div>
    <div class="bar-row"><div class="bar"><i id="bar"></i></div><span class="pct" id="pct">0%</span></div>
  </button>

  <section class="quick" id="quick">
    <form id="quickForm" autocomplete="off">
      <input id="quickInput" placeholder="Anotar pendência rápida…" enterkeyhint="done">
    </form>
    <div class="quick-q">
      <button class="qbtn q1" data-q="1">🔥 Agora</button>
      <button class="qbtn q2" data-q="2">⚡ Logo</button>
      <button class="qbtn q3" data-q="3">⭐ Agende</button>
      <button class="qbtn q4" data-q="4">☕ Quando der</button>
    </div>
  </section>

  <div id="board"></div>
</main>

<button class="fab" id="fab" aria-label="Nova tarefa">+</button>

<div class="sheet-bg" id="sheetBg"></div>

<!-- Menu -->
<div class="sheet" id="menuSheet">
  <div class="grab"></div><button class="sheet-close" data-close aria-label="Fechar">✕</button>
  <button class="menu-item install" data-act="install" id="installItem" hidden><span>📲</span>Instalar como aplicativo</button>
  <button class="menu-item" data-act="history"><span>✅</span>Concluídas e lixeira</button>
  <button class="menu-item" data-act="subs"><span>🏷️</span>Subcategorias</button>
  <button class="menu-item" data-act="export"><span>📥</span>Exportar planilha (Excel)</button>
  <button class="menu-item" data-act="import"><span>📤</span>Importar planilha (Excel)</button>
  <button class="menu-item" data-act="pdf"><span>🖨️</span>Salvar em PDF / Imprimir</button>
  <button class="menu-item" data-act="examples"><span>🧪</span>Carregar exemplos</button>
  <button class="menu-item danger" data-act="reset"><span>🗑️</span>Zerar tudo (vai para a lixeira)</button>
  <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
</div>

<!-- Concluídas e lixeira -->
<div class="sheet" id="histSheet">
  <div class="grab"></div><button class="sheet-close" data-close aria-label="Fechar">✕</button>
  <div class="tabs" id="histTabs">
    <button class="chip on" data-tab="done">✅ Concluídas</button>
    <button class="chip" data-tab="trash">🗑️ Lixeira</button>
  </div>
  <div class="hist" id="histList"></div>
  <div class="hist-foot" id="histFoot"></div>
</div>

<!-- Subcategorias -->
<div class="sheet sub-manage" id="subSheet">
  <div class="grab"></div><button class="sheet-close" data-close aria-label="Fechar">✕</button>
  <h2>Subcategorias</h2>
  <div class="hist" id="subList"></div>
  <form class="sub-add" id="subForm" autocomplete="off">
    <select id="subArea"><option>Pessoal</option><option>Trabalho</option></select>
    <input id="subName" placeholder="Nova (ex.: Pai)" maxlength="30">
    <button class="btn primary" style="flex:none">+</button>
  </form>
</div>

<!-- Formulário de tarefa -->
<div class="sheet" id="taskSheet">
  <div class="grab"></div><button class="sheet-close" data-close aria-label="Fechar">✕</button>
  <h2 id="formTitle">Nova tarefa</h2>
  <form id="taskForm" autocomplete="off">
    <div class="field">
      <label for="fTitle">O que precisa ser feito?</label>
      <input id="fTitle" required maxlength="200">
    </div>
    <div class="field">
      <label>Quadrante</label>
      <div class="seg quads" id="fQuad">
        <button type="button" data-v="1">🔥 Faça agora<small>Urgente & importante</small></button>
        <button type="button" data-v="2">⚡ Resolva logo<small>Urgente</small></button>
        <button type="button" data-v="3">⭐ Agende<small>Importante</small></button>
        <button type="button" data-v="4">☕ Quando der<small>Sem pressa, mas tem que fazer</small></button>
      </div>
    </div>
    <div class="field">
      <label>Área</label>
      <div class="seg" id="fArea">
        <button type="button" data-v="Trabalho">💼 Trabalho</button>
        <button type="button" data-v="Pessoal">👤 Pessoal</button>
      </div>
      <div class="seg subs" id="fSub"></div>
    </div>
    <div class="field">
      <label>Quando</label>
      <div class="seg" id="fWhen">
        <button type="button" data-v="0">Hoje</button>
        <button type="button" data-v="1">Amanhã</button>
        <button type="button" data-v="7">Em 1 semana</button>
        <button type="button" data-v="none">Sem data</button>
      </div>
      <div class="row2">
        <input type="date" id="fDate" aria-label="Data">
        <input type="time" id="fTime" aria-label="Horário">
      </div>
    </div>
    <div class="field">
      <label>Prioridade</label>
      <div class="seg" id="fPri">
        <button type="button" data-v="Baixa">Baixa</button>
        <button type="button" data-v="Média">Média</button>
        <button type="button" data-v="Alta">▲ Alta</button>
      </div>
    </div>
    <div class="field">
      <label for="fDesc">Observação (opcional)</label>
      <textarea id="fDesc" maxlength="1000"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="fDelete" hidden>🗑️</button>
      <button type="button" class="btn" id="fCancel">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Desfazer</button></div>

<script>
(function () {
  'use strict';

  const STORE = 'focusmatriz.tasks.v3';
  const UI_STORE = 'focusmatriz.ui.v3';
  const OLD_STORE = 'focusmatriz.tasks.v2';
  const TRASH_DAYS = 30;

  const QUADS = {
    1: { key: 'q1', icon: '🔥', name: 'Urgente & Importante', action: 'Faça agora', label: 'Q1: Urgente & Importante' },
    2: { key: 'q2', icon: '⚡', name: 'Urgente', action: 'Resolva logo', label: 'Q2: Urgente' },
    3: { key: 'q3', icon: '⭐', name: 'Importante', action: 'Agende', label: 'Q3: Importante' },
    4: { key: 'q4', icon: '☕', name: 'Quando der', action: 'Sem pressa', label: 'Q4: Quando der' }
  };
  const AREAS = { 'Trabalho': '💼', 'Pessoal': '👤' };
  const DEFAULT_SUBS = { Trabalho: [], Pessoal: ['Pai', 'Casa Ilha', 'Casa Cabo Frio', 'Saúde', 'Finanças', 'Diversos'] };
  const PRI_RANK = { 'Alta': 0, 'Média': 1, 'Baixa': 2 };

  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  function load(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
    catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* armazenamento indisponível */ }
  }

  const ui = Object.assign({ filter: 'all', sub: '', closed: { later: true }, lastArea: 'Trabalho', lastSub: '', subs: DEFAULT_SUBS }, load(UI_STORE, {}));
  ui.subs = Object.assign({ Trabalho: [], Pessoal: [] }, ui.subs);

  // Converte as antigas categorias (Casa, Saúde...) em área + subcategoria.
  function areaFromCategory(cat) {
    if (!cat || cat === 'Trabalho') return { area: 'Trabalho', sub: '' };
    if (cat === 'Pessoal') return { area: 'Pessoal', sub: '' };
    return { area: 'Pessoal', sub: cat };
  }

  function addSub(area, sub) {
    if (!sub) return;
    const list = ui.subs[area] || (ui.subs[area] = []);
    if (!list.some(s => s.toLowerCase() === sub.toLowerCase())) list.push(sub);
  }

  let tasks = load(STORE, null);
  if (tasks == null) {
    // Migração da versão anterior: Q2 e Q3 trocaram de lugar e as categorias viraram área + subcategoria.
    tasks = load(OLD_STORE, []).map(t => {
      const a = areaFromCategory(t.category);
      addSub(a.area, a.sub);
      return {
        id: t.id, title: t.title, description: t.description || '',
        quadrant: t.quadrant === 2 ? 3 : t.quadrant === 3 ? 2 : t.quadrant,
        area: a.area, sub: a.sub, priority: t.priority || 'Média',
        date: t.date || '', time: t.time || '',
        done: !!t.done, completedAt: t.completedAt || null, deletedAt: null
      };
    });
  }
  // Lixeira guarda por 30 dias.
  const trashLimit = Date.now() - TRASH_DAYS * 86400000;
  tasks = tasks.filter(t => !t.deletedAt || new Date(t.deletedAt).getTime() > trashLimit);

  const persist = () => save(STORE, tasks);
  const persistUi = () => save(UI_STORE, ui);
  persist(); persistUi();

  // ---------- Datas ----------
  const pad = n => String(n).padStart(2, '0');
  const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const todayIso = () => isoDate(new Date());
  const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoDate(d); };

  function daysBetween(a, b) {
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  }
  const fmtDay = iso => new Date(iso + 'T00:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
  const fmtStamp = iso => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const newId = () => 'tsk-' + Date.now() + Math.floor(Math.random() * 1000);

  // ---------- Seleção ----------
  const alive = t => !t.deletedAt;
  const isFuture = t => !!t.date && t.date > todayIso();
  function matchesFilter(t) {
    if (ui.filter !== 'all' && t.area !== ui.filter) return false;
    if (ui.sub && t.sub !== ui.sub) return false;
    return true;
  }

  function sortPending(a, b) {
    return (PRI_RANK[a.priority] ?? 1) - (PRI_RANK[b.priority] ?? 1)
      || (a.date || '9999').localeCompare(b.date || '9999')
      || (a.time || '99').localeCompare(b.time || '99');
  }

  function taskHtml(t, opts) {
    let when = '';
    if (t.date && !(opts && opts.noDate)) {
      const diff = daysBetween(todayIso(), t.date);
      if (diff < 0) when = '<span class="late">⚠️ atrasada ' + (-diff) + 'd</span>';
      else if (diff > 0) when = '<span>📅 ' + fmtDay(t.date) + '</span>';
    }
    const meta = [
      '<span>' + AREAS[t.area] + ' ' + esc(t.sub ? t.area + ' · ' + t.sub : t.area) + '</span>',
      t.priority === 'Alta' ? '<span class="hi">▲ Alta</span>' : '',
      when,
      t.time ? '<span>⏰ ' + esc(t.time) + '</span>' : '',
      t.description ? '<span class="desc">📝 ' + esc(t.description) + '</span>' : ''
    ].join('');
    return '<div class="task ' + QUADS[t.quadrant].key + '" data-id="' + esc(t.id) + '">' +
      '<button class="check" data-check aria-label="Concluir">✓</button>' +
      '<button class="task-main" data-edit>' +
        '<div class="task-title">' + esc(t.title) + '</div>' +
        '<div class="meta">' + meta + '</div>' +
      '</button>' +
    '</div>';
  }

  // ---------- Renderização ----------
  function render() {
    const today = todayIso();
    const live = tasks.filter(alive);
    const pendingAll = live.filter(t => !t.done);
    const nowList = pendingAll.filter(t => !isFuture(t));

    // filtros de área
    const cnt = a => nowList.filter(t => a === 'all' || t.area === a).length;
    $('#filters').innerHTML = [['all', '🌟 Todos'], ['Trabalho', '💼 Trabalho'], ['Pessoal', '👤 Pessoal']]
      .map(([k, l]) => '<button class="chip' + (ui.filter === k ? ' on' : '') + '" data-filter="' + k + '">' + l + '<b>' + cnt(k) + '</b></button>')
      .join('');

    // filtros de subcategoria (só as que têm tarefas)
    let subHtml = '';
    if (ui.filter !== 'all') {
      const used = {};
      pendingAll.filter(t => t.area === ui.filter && t.sub).forEach(t => { used[t.sub] = (used[t.sub] || 0) + 1; });
      const names = Object.keys(used).sort((a, b) => a.localeCompare(b, 'pt-BR'));
      if (ui.sub && !used[ui.sub]) ui.sub = '';
      if (names.length) {
        subHtml = '<button class="chip small' + (!ui.sub ? ' on' : '') + '" data-sub="">Todas</button>' +
          names.map(n => '<button class="chip small' + (ui.sub === n ? ' on' : '') + '" data-sub="' + esc(n) + '">' + esc(n) + '<b>' + used[n] + '</b></button>').join('');
      }
    } else ui.sub = '';
    $('#subFilters').innerHTML = subHtml;

    const shownNow = nowList.filter(matchesFilter);
    const shownLater = pendingAll.filter(t => isFuture(t) && matchesFilter(t));

    // resumo do dia
    const doneToday = live.filter(t => t.done && t.completedAt && isoDate(new Date(t.completedAt)) === today && matchesFilter(t)).length;
    const total = doneToday + shownNow.length;
    const pct = total ? Math.round(doneToday / total * 100) : 0;
    $('#doneToday').textContent = doneToday;
    $('#pendingCount').textContent = shownNow.length;
    $('#q1Count').textContent = shownNow.filter(t => t.quadrant === 1).length;
    $('#bar').style.width = pct + '%';
    $('#pct').textContent = pct + '%';

    // quadrantes
    let html = [1, 2, 3, 4].map(q => {
      const Q = QUADS[q];
      const list = shownNow.filter(t => t.quadrant === q).sort(sortPending);
      const body = list.length ? list.map(t => taskHtml(t)).join('')
        : '<div class="empty">' + (q === 1 ? '🎉 Nada urgente agora. Bom trabalho!' : 'Nada por aqui hoje.') + '</div>';
      return '<section class="quad ' + Q.key + (ui.closed[q] ? ' closed' : '') + '">' +
        '<button class="quad-head" data-toggle="' + q + '">' +
          '<span class="qt"><small>Q' + q + ' · ' + Q.action + '</small>' + Q.icon + ' ' + Q.name + '</span>' +
          '<span class="count">' + list.length + '</span><span class="caret">▼</span>' +
        '</button><div class="quad-body">' + body + '</div></section>';
    }).join('');

    // próximos dias (fora da tela de hoje)
    if (shownLater.length) {
      const sorted = shownLater.slice().sort((a, b) => a.date.localeCompare(b.date) || a.quadrant - b.quadrant || (a.time || '99').localeCompare(b.time || '99'));
      let body = '', lastDay = '';
      sorted.forEach(t => {
        if (t.date !== lastDay) { lastDay = t.date; body += '<div class="day">' + (daysBetween(today, t.date) === 1 ? 'Amanhã' : fmtDay(t.date)) + '</div>'; }
        body += taskHtml(t, { noDate: true });
      });
      html += '<section class="quad later' + (ui.closed.later ? ' closed' : '') + '">' +
        '<button class="quad-head" data-toggle="later">' +
          '<span class="qt"><small>Agendadas para depois</small>📅 Próximos dias</span>' +
          '<span class="count">' + sorted.length + '</span><span class="caret">▼</span>' +
        '</button><div class="quad-body">' + body + '</div></section>';
    }
    $('#board').innerHTML = html;

    $('#todayLabel').textContent = 'Hoje, ' + new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
    persistUi();
  }

  // ---------- Aviso com desfazer ----------
  let toastTimer = null, undoFn = null;
  function toast(msg, undo) {
    $('#toastMsg').textContent = msg;
    $('#toastUndo').hidden = !undo;
    undoFn = undo || null;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 5000);
  }
  $('#toastUndo').addEventListener('click', () => {
    if (undoFn) undoFn();
    undoFn = null;
    $('#toast').classList.remove('show');
  });

  function snapshotUndo() {
    const before = JSON.stringify(tasks);
    return () => { tasks = JSON.parse(before); persist(); render(); renderHistory(); };
  }

  // ---------- Ações no quadro ----------
  document.addEventListener('click', e => {
    const f = e.target.closest('[data-filter]');
    if (f) { ui.filter = f.dataset.filter; ui.sub = ''; render(); return; }

    const sf = e.target.closest('[data-sub]');
    if (sf) { ui.sub = sf.dataset.sub; render(); return; }

    const tg = e.target.closest('[data-toggle]');
    if (tg) { const q = tg.dataset.toggle; ui.closed[q] = !ui.closed[q]; render(); return; }

    const card = e.target.closest('#board .task');
    if (!card) return;
    const t = tasks.find(x => x.id === card.dataset.id);
    if (!t) return;

    if (e.target.closest('[data-check]')) {
      // Concluir tira a tarefa da tela; ela fica em "Concluídas" para recuperar.
      const undo = snapshotUndo();
      t.done = true;
      t.completedAt = new Date().toISOString();
      persist();
      card.classList.add('leaving');
      setTimeout(render, 260);
      toast('Meta realizada! ✅', undo);
    } else if (e.target.closest('[data-edit]')) {
      openForm(t);
    }
  });

  $('#todayCard').addEventListener('click', () => openHistory('done'));

  // ---------- Captura rápida ----------
  const quickInput = $('#quickInput');
  quickInput.addEventListener('input', () => $('#quick').classList.toggle('typing', quickInput.value.trim() !== ''));
  function quickAdd(q) {
    const title = quickInput.value.trim();
    if (!title) return;
    const area = ui.filter !== 'all' ? ui.filter : ui.lastArea || 'Trabalho';
    tasks.unshift({
      id: newId(), title, description: '', quadrant: q, area, sub: ui.sub || '',
      priority: 'Média', date: todayIso(), time: '', done: false, completedAt: null, deletedAt: null
    });
    persist();
    quickInput.value = '';
    $('#quick').classList.remove('typing');
    ui.closed[q] = false;
    render();
    toast('Adicionada em ' + QUADS[q].name + ' · toque para detalhar');
  }
  $$('.quick-q .qbtn').forEach(b => b.addEventListener('click', () => quickAdd(Number(b.dataset.q))));
  $('#quickForm').addEventListener('submit', e => { e.preventDefault(); quickAdd(1); });

  // ---------- Folhas ----------
  function openSheet(id) {
    $$('.sheet').forEach(s => s.classList.remove('open'));
    $('#sheetBg').classList.add('open');
    $(id).classList.add('open');
  }
  function closeSheets() {
    $('#sheetBg').classList.remove('open');
    $$('.sheet').forEach(s => s.classList.remove('open'));
  }
  $('#sheetBg').addEventListener('click', closeSheets);
  $('#menuBtn').addEventListener('click', () => openSheet('#menuSheet'));
  $('#fab').addEventListener('click', () => openForm(null));
  $('#fCancel').addEventListener('click', closeSheets);
  $$('[data-close]').forEach(b => b.addEventListener('click', closeSheets));

  // ---------- Formulário ----------
  function segSet(sel, v) { $$(sel + ' button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === String(v))); }
  function segGet(sel) { const b = $(sel + ' button.on'); return b ? b.dataset.v : null; }

  let formSub = '';
  function renderSubChips() {
    const area = segGet('#fArea') || 'Trabalho';
    const list = (ui.subs[area] || []).slice();
    if (formSub && !list.includes(formSub)) list.push(formSub);
    $('#fSub').innerHTML = list.map(s => '<button type="button" data-v="' + esc(s) + '"' + (s === formSub ? ' class="on"' : '') + '>' + esc(s) + '</button>').join('') +
      '<button type="button" class="add" data-add>+ Nova</button>';
  }

  $('#fQuad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) segSet('#fQuad', b.dataset.v); });
  $('#fPri').addEventListener('click', e => { const b = e.target.closest('button'); if (b) segSet('#fPri', b.dataset.v); });
  $('#fArea').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (segGet('#fArea') !== b.dataset.v) formSub = '';
    segSet('#fArea', b.dataset.v); renderSubChips();
  });
  $('#fSub').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-add')) {
      const name = (prompt('Nome da subcategoria (ex.: Pai, Casa Ilha):') || '').trim().slice(0, 30);
      if (!name) return;
      addSub(segGet('#fArea') || 'Trabalho', name);
      persistUi();
      formSub = name;
    } else {
      formSub = formSub === b.dataset.v ? '' : b.dataset.v; // tocar de novo desmarca
    }
    renderSubChips();
  });

  function syncWhen() {
    const d = $('#fDate').value;
    const v = !d ? 'none' : d === addDays(0) ? '0' : d === addDays(1) ? '1' : d === addDays(7) ? '7' : '';
    segSet('#fWhen', v);
  }
  $('#fWhen').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $('#fDate').value = b.dataset.v === 'none' ? '' : addDays(Number(b.dataset.v));
    syncWhen();
  });
  $('#fDate').addEventListener('change', syncWhen);

  let editing = null;
  function openForm(t) {
    editing = t;
    $('#formTitle').textContent = t ? 'Editar tarefa' : 'Nova tarefa';
    $('#fTitle').value = t ? t.title : '';
    $('#fDesc').value = t ? (t.description || '') : '';
    $('#fDate').value = t ? (t.date || '') : todayIso();
    $('#fTime').value = t ? (t.time || '') : '';
    segSet('#fQuad', t ? t.quadrant : 1);
    segSet('#fArea', t ? t.area : (ui.filter !== 'all' ? ui.filter : ui.lastArea || 'Trabalho'));
    formSub = t ? (t.sub || '') : (ui.sub || '');
    renderSubChips();
    segSet('#fPri', t ? t.priority : 'Média');
    syncWhen();
    $('#fDelete').hidden = !t;
    openSheet('#taskSheet');
    if (!t) setTimeout(() => $('#fTitle').focus(), 250);
  }

  $('#taskForm').addEventListener('submit', e => {
    e.preventDefault();
    const data = {
      title: $('#fTitle').value.trim(),
      description: $('#fDesc').value.trim(),
      quadrant: Number(segGet('#fQuad') || 1),
      area: segGet('#fArea') || 'Trabalho',
      sub: formSub,
      priority: segGet('#fPri') || 'Média',
      date: $('#fDate').value,
      time: $('#fTime').value
    };
    if (!data.title) return;
    if (editing) Object.assign(editing, data);
    else tasks.unshift(Object.assign({ id: newId(), done: false, completedAt: null, deletedAt: null }, data));
    ui.lastArea = data.area;
    if (data.date && data.date > todayIso()) { ui.closed.later = false; toast('Agendada para ' + fmtDay(data.date) + ' · está em Próximos dias'); }
    else ui.closed[data.quadrant] = false;
    persist(); closeSheets(); render();
  });

  $('#fDelete').addEventListener('click', () => {
    if (!editing) return;
    const undo = snapshotUndo();
    editing.deletedAt = new Date().toISOString();
    persist(); closeSheets(); render();
    toast('Movida para a lixeira', undo);
  });

  // ---------- Concluídas e lixeira ----------
  let histTab = 'done';
  function openHistory(tab) { histTab = tab; renderHistory(); openSheet('#histSheet'); }
  $('#histTabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    histTab = b.dataset.tab; renderHistory();
  });

  function renderHistory() {
    $$('#histTabs .chip').forEach(b => b.classList.toggle('on', b.dataset.tab === histTab));
    let items, foot = '';
    if (histTab === 'done') {
      items = tasks.filter(t => alive(t) && t.done)
        .sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || '')).slice(0, 200)
        .map(t => [t, 'Concluída ' + (t.completedAt ? fmtStamp(t.completedAt) : ''), '↩ Voltar']);
    } else {
      items = tasks.filter(t => !alive(t))
        .sort((a, b) => b.deletedAt.localeCompare(a.deletedAt))
        .map(t => [t, 'Apagada ' + fmtStamp(t.deletedAt) + ' · some em ' + TRASH_DAYS + ' dias', '↩ Restaurar']);
      if (items.length) foot = '<button class="btn danger" style="width:100%" data-empty-trash>Esvaziar lixeira</button>';
    }
    $('#histList').innerHTML = items.length ? items.map(([t, sub, label]) =>
      '<div class="hist-item"><div><b>' + QUADS[t.quadrant].icon + ' ' + esc(t.title) + '</b><small>' + esc(sub) + '</small></div>' +
      '<button data-restore="' + esc(t.id) + '">' + label + '</button></div>').join('')
      : '<div class="empty">' + (histTab === 'done' ? 'Nenhuma tarefa concluída ainda.' : 'A lixeira está vazia.') + '</div>';
    $('#histFoot').innerHTML = foot;
  }

  $('#histSheet').addEventListener('click', e => {
    const r = e.target.closest('[data-restore]');
    if (r) {
      const t = tasks.find(x => x.id === r.dataset.restore);
      if (!t) return;
      if (histTab === 'done') { t.done = false; t.completedAt = null; }
      else t.deletedAt = null;
      persist(); render(); renderHistory();
      toast('Tarefa de volta na lista');
      return;
    }
    if (e.target.closest('[data-empty-trash]')) {
      if (!confirm('Apagar de vez as tarefas da lixeira?')) return;
      tasks = tasks.filter(alive);
      persist(); renderHistory();
    }
  });

  // ---------- Subcategorias ----------
  function renderSubs() {
    const rows = [];
    Object.keys(AREAS).forEach(area => (ui.subs[area] || []).forEach(s => rows.push([area, s])));
    $('#subList').innerHTML = rows.length ? rows.map(([a, s]) =>
      '<div class="hist-item"><div><b>' + esc(s) + '</b><small>' + AREAS[a] + ' ' + a + '</small></div>' +
      '<button data-del-sub="' + esc(a) + '|' + esc(s) + '">Remover</button></div>').join('')
      : '<div class="empty">Nenhuma subcategoria.</div>';
  }
  $('#subList').addEventListener('click', e => {
    const b = e.target.closest('[data-del-sub]'); if (!b) return;
    const [a, s] = b.dataset.delSub.split('|');
    ui.subs[a] = (ui.subs[a] || []).filter(x => x !== s);
    persistUi(); renderSubs();
  });
  $('#subForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#subName').value.trim().slice(0, 30);
    if (!name) return;
    addSub($('#subArea').value, name);
    $('#subName').value = '';
    persistUi(); renderSubs();
  });

  // ---------- Instalar como app ----------
  let installEvent = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; $('#installItem').hidden = false; });
  window.addEventListener('appinstalled', () => { installEvent = null; $('#installItem').hidden = true; });

  // ---------- Menu ----------
  $('#menuSheet').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'import') { $('#fileInput').click(); return; }
    if (act === 'history') { openHistory('done'); return; }
    if (act === 'subs') { renderSubs(); openSheet('#subSheet'); return; }
    closeSheets();
    if (act === 'install' && installEvent) { installEvent.prompt(); installEvent = null; $('#installItem').hidden = true; }
    if (act === 'export') exportXlsx();
    if (act === 'pdf') setTimeout(() => window.print(), 250);
    if (act === 'examples') loadExamples();
    if (act === 'reset') {
      const live = tasks.filter(alive);
      if (!live.length) return;
      if (!confirm('Mover TODAS as tarefas para a lixeira? Dá para restaurar por ' + TRASH_DAYS + ' dias.')) return;
      const undo = snapshotUndo();
      const now = new Date().toISOString();
      live.forEach(t => { t.deletedAt = now; });
      persist(); render();
      toast('Tudo na lixeira', undo);
    }
  });

  function loadExamples() {
    const ex = [
      ['Pagar conta de luz (vence hoje)', 1, 'Pessoal', 'Finanças', 'Alta', 0, '10:00'],
      ['Responder e-mail do cliente', 1, 'Trabalho', '', 'Média', 0, '09:00'],
      ['Ligar para o encanador', 2, 'Pessoal', 'Casa Cabo Frio', 'Média', 0, ''],
      ['Consulta médica do pai', 3, 'Pessoal', 'Pai', 'Média', 7, '15:00'],
      ['Planejar metas do trimestre', 3, 'Trabalho', '', 'Média', 2, ''],
      ['Organizar fotos antigas', 4, 'Pessoal', 'Diversos', 'Baixa', null, '']
    ];
    const undo = snapshotUndo();
    ex.forEach(([title, quadrant, area, sub, priority, days, time]) => tasks.push({
      id: newId(), title, description: '', quadrant, area, sub, priority,
      date: days == null ? '' : addDays(days), time, done: false, completedAt: null, deletedAt: null
    }));
    persist(); render();
    toast('Exemplos carregados', undo);
  }

  // ---------- Planilha (mesmas colunas do app antigo) ----------
  const COLS = ['ID', 'Título', 'Tipo', 'Descrição', 'Quadrante', 'Categoria', 'Prioridade', 'Data', 'Horário', 'Status', 'Concluída em'];
  let xlsxPromise = null;
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxPromise) xlsxPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = () => resolve(window.XLSX);
      s.onerror = () => { xlsxPromise = null; reject(new Error('Sem internet para carregar o leitor de planilhas.')); };
      document.head.appendChild(s);
    });
    return xlsxPromise;
  }

  async function exportXlsx() {
    try {
      const XLSX = await loadXlsx();
      const rows = tasks.filter(alive).map(t => [
        t.id, t.title, t.area.toUpperCase(), t.description || '', QUADS[t.quadrant].label, t.sub || t.area, t.priority,
        t.date || '', t.time || '', t.done ? 'Concluída' : 'Pendente',
        t.completedAt ? new Date(t.completedAt).toLocaleString('pt-BR') : ''
      ]);
      const ws = XLSX.utils.aoa_to_sheet([COLS].concat(rows));
      ws['!cols'] = [18, 40, 12, 30, 24, 16, 10, 12, 8, 10, 20].map(w => ({ wch: w }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Tarefas Eisenhower');
      XLSX.writeFile(wb, 'Tarefas_Matriz_Eisenhower_' + todayIso() + '.xlsx');
    } catch (err) { alert(err.message); }
  }

  function parseBrDateTime(s) {
    // "27/10/2026, 21:56:33" -> ISO
    const m = String(s || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\D+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
    if (!m) return null;
    return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 12), +(m[5] || 0), +(m[6] || 0)).toISOString();
  }

  function normDate(v) {
    if (v instanceof Date) return isoDate(v);
    const s = String(v || '').trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    return m ? m[3] + '-' + pad(m[2]) + '-' + pad(m[1]) : '';
  }

  // Lê o quadrante pelo nome, então serve tanto para planilhas antigas (Q2 = Importante) quanto novas (Q2 = Urgente).
  function quadFromLabel(label) {
    const s = String(label || '').toLowerCase();
    const urg = s.includes('urgente'), imp = s.includes('importante');
    if (urg && imp) return 1;
    if (urg) return 2;
    if (imp) return 3;
    if (s.includes('quando') || s.includes('descart') || s.includes('elimin')) return 4;
    const m = s.match(/q\s*([1-4])/);
    return m ? Number(m[1]) : 1;
  }

  function areaFromRow(tipo, cat) {
    tipo = String(tipo || '').trim().toUpperCase();
    cat = String(cat || '').trim();
    const area = tipo.startsWith('TRAB') ? 'Trabalho' : tipo ? 'Pessoal' : areaFromCategory(cat).area;
    const sub = !cat || /^(trabalho|pessoal|particular)$/i.test(cat) ? '' : cat;
    return { area, sub };
  }

  $('#fileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    closeSheets();
    if (!file) return;
    try {
      const XLSX = await loadXlsx();
      const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      const undo = snapshotUndo();
      let added = 0, updated = 0;
      rows.forEach(r => {
        const title = String(r['Título'] || r['Titulo'] || '').trim();
        if (!title) return;
        const done = /conclu/i.test(String(r['Status'] || ''));
        const a = areaFromRow(r['Tipo'], r['Categoria']);
        addSub(a.area, a.sub);
        const t = {
          id: String(r['ID'] || '').trim() || newId(),
          title,
          description: String(r['Descrição'] || r['Descricao'] || '').trim(),
          quadrant: quadFromLabel(r['Quadrante']),
          area: a.area, sub: a.sub,
          priority: ['Alta', 'Média', 'Baixa'].includes(String(r['Prioridade']).trim()) ? String(r['Prioridade']).trim() : 'Média',
          date: normDate(r['Data']),
          time: String(r['Horário'] || r['Horario'] || '').trim().slice(0, 5),
          done,
          completedAt: done ? (parseBrDateTime(r['Concluída em']) || new Date().toISOString()) : null,
          deletedAt: null
        };
        const i = tasks.findIndex(x => x.id === t.id);
        if (i >= 0) { tasks[i] = t; updated++; } else { tasks.push(t); added++; }
      });
      persist(); persistUi(); render();
      toast('Importadas: ' + added + ' novas, ' + updated + ' atualizadas', undo);
    } catch (err) {
      alert('Não consegui ler a planilha: ' + err.message);
    }
  });

  // Atualiza "hoje", atrasadas e próximos quando o app volta para a tela.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) $('#logo').pauseAnimations();

  // App instalável e funcionando sem internet.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  render();
})();
</script>
</body>
